<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - FaciliBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center vh-100" style="background: linear-gradient(135deg, #0d6efd 0%, #003d99 100%);">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card p-4 shadow-lg rounded-4 text-center">
          <h3 class="fw-bold mb-1">Create Account</h3>
          <p class="text-muted mb-4">Join the NHS Reservation Portal</p>

          <form id="registerForm">
            <div class="form-floating mb-3">
              <input type="text" class="form-control rounded-3" id="regName" placeholder="Full Name" required>
              <label for="regName">Full Name</label>
            </div>
            <div class="form-floating mb-3">
              <input type="text" class="form-control rounded-3" id="regStudentId" placeholder="Student ID" required>
              <label for="regStudentId">Student ID (e.g. TUPM-22-XXXX)</label>
            </div>
            <div class="form-floating mb-3">
              <input type="email" class="form-control rounded-3" id="regEmail" placeholder="Email" required>
              <label for="regEmail">Email Address</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control rounded-3" id="regPwd" placeholder="Password" required>
              <label for="regPwd">Password (min 6 characters)</label>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 py-3 btn-round mb-3">Register</button>
            <p class="small mb-0 text-muted">Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Login here</a></p>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="toastContainer" style="position:fixed; top:20px; right:20px; z-index:9999; min-width:280px;"></div>
  
  <script type="module" src="script.js"></script>
</body>
</html>
