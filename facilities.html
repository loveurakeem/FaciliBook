<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facilities - FaciliBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <div id="sidebar-wrapper">
    <div class="sidebar-heading">
      <div class="fw-bold">FaciliBook</div>
      <div class="small fw-normal opacity-75" style="font-size:.7rem;">NHS Reservation Portal</div>
    </div>
    <div class="list-group mt-3">
      <small class="px-4 text-uppercase opacity-50 mb-2" style="font-size:.6rem;">Main</small>
      <a href="dashboard.html"        class="list-group-item">Dashboard</a>
      <a href="facilities.html"       class="list-group-item active">Facilities</a>
      <a href="reservation-form.html" class="list-group-item">Reserve a Facility</a>

      <small class="px-4 text-uppercase opacity-50 mb-2 mt-4" style="font-size:.6rem;">My Account</small>
      <a href="my-reservations.html"  class="list-group-item">My Reservations</a>
      <a href="profile.html"          class="list-group-item">Profile</a>

      <a href="#" onclick="logout()" class="list-group-item mt-5 text-white">Logout</a>
    </div>
  </div>

  <!-- Page Content -->
  <div class="container-fluid px-5">
    <div class="d-flex justify-content-between align-items-center py-4">
      <h4 class="mb-0">Available <span class="text-primary fw-bold">Facilities</span></h4>
    </div>

    <!--
      Cards are rendered dynamically by script.js → initFacilities() → renderFacilityCards()
      which reads from Firestore's "facilities" collection.

      To seed the default facilities for the first time, open the browser console on this page
      and run:  seedFacilities()
      (imported and exposed by firebase.js)
    -->
    <div class="row g-4 mb-5" id="facilityGrid">
      <div class="col-12 text-center text-muted py-5">Loading facilities…</div>
    </div>

    <footer class="text-center text-muted py-4 small">
      School Facility Reservation System © 2026 | National High School
    </footer>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer"
     style="position:fixed; top:20px; right:20px; z-index:9999; min-width:280px;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
