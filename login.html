<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - FaciliBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="d-flex align-items-center vh-100"
      style="background: linear-gradient(135deg, #0d6efd 0%, #003d99 100%);">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">

        <div class="card p-4 shadow-lg text-center rounded-4">

          <!-- Logo -->
          <div class="mb-3">
            <div class="bg-primary text-white rounded-circle d-inline-flex
                        align-items-center justify-content-center"
                 style="width:70px; height:70px;">
              <span class="h4 mb-0">NHS</span>
            </div>
          </div>

          <h3 class="fw-bold mb-1">Welcome!</h3>
          <p class="text-muted mb-4">Sign in to your account</p>

          <!-- Login Form -->
          <!-- NOTE: Use your student's email address (e.g. student@school.edu) -->
          <form id="loginForm">
            <div class="form-floating mb-3">
              <input type="email" class="form-control rounded-3"
                     id="uid" placeholder="Email" required>
              <label for="uid">Email Address</label>
            </div>
            <div class="form-floating mb-3">
              <input type="password" class="form-control rounded-3"
                     id="pwd" placeholder="Password" required>
              <label for="pwd">Password</label>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 btn-round mb-3">
              Login
            </button>
            <a href="#" class="text-decoration-none small">Forgot Password?</a>
          </form>

        </div><!-- /card -->

        <div class="mt-3 text-center">
            <p class="small text-muted">Don't have an account? 
                <a href="register.html" class="text-primary fw-bold text-decoration-none">Register an account</a>
            </p>
        </div>

        <div class="text-center mt-4 text-white-50 small">
          School Facility Reservation System © 2026
        </div>

      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer"
       style="position:fixed; top:20px; right:20px; z-index:9999; min-width:280px;">
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <!-- type="module" is required for ES module imports (firebase.js / script.js) -->
  <script type="module" src="script.js"></script>
</body>
</html>
