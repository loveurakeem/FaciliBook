<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Profile - FaciliBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <div id="sidebar-wrapper">
    <div class="sidebar-heading">
      <div class="fw-bold">FaciliBook</div>
      <div class="small fw-normal opacity-75" style="font-size:.7rem;">NHS Reservation Portal</div>
    </div>
    <div class="list-group mt-3">
      <small class="px-4 text-uppercase opacity-50 mb-2" style="font-size:.6rem;">Main</small>
      <a href="dashboard.html"        class="list-group-item">Dashboard</a>
      <a href="facilities.html"       class="list-group-item">Facilities</a>
      <a href="reservation-form.html" class="list-group-item">Reserve a Facility</a>

      <small class="px-4 text-uppercase opacity-50 mb-2 mt-4" style="font-size:.6rem;">My Account</small>
      <a href="my-reservations.html"  class="list-group-item">My Reservations</a>
      <a href="profile.html"          class="list-group-item active">Profile</a>

      <a href="index.html" onclick="logout()" class="list-group-item mt-5 text-white">Logout</a>
    </div>
  </div>

  <!-- Page Content -->
  <div class="container-fluid px-5">
    <div class="d-flex justify-content-between align-items-center py-4">
      <h4 class="mb-0 text-muted">Account / <span class="text-dark fw-bold">Profile</span></h4>
    </div>

    <div class="row g-4">

      <!-- Profile Header -->
      <div class="col-12">
        <div class="card border-0 shadow-sm rounded-4 p-4"
             style="background: linear-gradient(to right, #2c52e1, #4e73df);">
          <div class="d-flex align-items-center text-white">
            <div class="bg-white text-primary rounded-circle d-flex align-items-center
                        justify-content-center fw-bold fs-1 shadow"
                 style="width:100px; height:100px; border:4px solid rgba(255,255,255,0.2);">
              S
            </div>
            <div class="ms-4">
              <!-- IDs match script.js initProfile() -->
              <h2 class="fw-bold mb-0" id="profileDisplayName">Loading…</h2>
              <p class="mb-0 opacity-75" id="profileDisplayCourse">—</p>
              <span class="badge bg-white text-primary mt-2 rounded-pill px-3">NHS</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Personal Information Form -->
      <div class="col-12">
        <div class="card border-0 shadow-sm rounded-4 p-4">
          <h5 class="fw-bold mb-4">Personal Information</h5>
          <form id="profileForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">FIRST NAME</label>
                <!-- ID: profileFirstName — read/written by initProfile() & handleProfileUpdate() -->
                <input type="text" class="form-control rounded-3" id="profileFirstName" placeholder="First name">
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">LAST NAME</label>
                <!-- ID: profileLastName -->
                <input type="text" class="form-control rounded-3" id="profileLastName" placeholder="Last name">
              </div>
              <div class="col-md-12">
                <label class="form-label text-muted small fw-bold">EMAIL ADDRESS</label>
                <!-- ID: profileEmail — readonly, set from auth user -->
                <input type="email" class="form-control rounded-3 bg-light" id="profileEmail" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">STUDENT ID</label>
                <!-- ID: profileStudentId — readonly, set at registration -->
                <input type="text" class="form-control rounded-3 bg-light" id="profileStudentId" readonly>
              </div>
              <div class="col-md-6">
                <label class="form-label text-muted small fw-bold">COURSE / GRADE &amp; SECTION</label>
                <!-- ID: profileCourse — editable -->
                <input type="text" class="form-control rounded-3" id="profileCourse"
                       placeholder="e.g. Grade 11 – STEM A">
              </div>
            </div>
            <hr class="my-4 opacity-25">
            <div class="d-flex justify-content-end">
              <button type="submit" class="btn btn-primary btn-round px-4">Save Changes</button>
            </div>
          </form>
        </div>
      </div>

    </div><!-- /row -->

    <footer class="text-center text-muted py-5 small">
      School Facility Reservation System © 2026 | National High School
    </footer>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer"
     style="position:fixed; top:20px; right:20px; z-index:9999; min-width:280px;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
