<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - FaciliBook</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="d-flex" id="wrapper">

  <!-- Sidebar -->
  <div id="sidebar-wrapper">
    <div class="sidebar-heading">
      <div class="fw-bold">FaciliBook</div>
      <div class="small fw-normal opacity-75" style="font-size:.7rem;">NHS Management Portal</div>
    </div>
    <div class="list-group mt-3">
      <small class="px-4 text-uppercase opacity-50 mb-2" style="font-size:.6rem;">Management</small>
      <a href="admin.html"     class="list-group-item active">Manage Requests</a>
      <a href="dashboard.html" class="list-group-item">Student View</a>

      <a href="#" onclick="logout()" class="list-group-item mt-5 text-white">Logout</a>
    </div>
  </div>

  <!-- Page Content -->
  <div class="container-fluid px-5">

    <div class="d-flex justify-content-between align-items-center py-4">
      <h4 class="mb-0 text-muted">Admin / <span class="text-dark fw-bold">Analytics</span></h4>
    </div>

    <!-- Admin Stats — IDs are read by script.js -->
    <div class="row g-4 mb-5">
      <div class="col-md-3">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-white text-center">
          <div class="text-muted small fw-bold">TOTAL REQUESTS</div>
          <div class="h2 fw-bold mb-0" id="statTotal">—</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-success text-white text-center">
          <div class="small fw-bold opacity-75">APPROVED</div>
          <div class="h2 fw-bold mb-0" id="statApproved">—</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-warning text-dark text-center">
          <div class="small fw-bold opacity-75">PENDING</div>
          <div class="h2 fw-bold mb-0" id="statPending">—</div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm rounded-4 p-3 bg-danger text-white text-center">
          <div class="small fw-bold opacity-75">REJECTED</div>
          <div class="h2 fw-bold mb-0" id="statRejected">—</div>
        </div>
      </div>
    </div>

    <!-- All Reservation Requests Table -->
    <div class="card shadow-sm border-0 rounded-4 overflow-hidden mb-5">
      <div class="p-4 bg-white border-bottom">
        <h5 class="fw-bold mb-0">All Reservation Requests</h5>
      </div>
      <div class="table-responsive">
        <table class="table mb-0 align-middle">
          <thead class="bg-light">
            <tr class="text-muted small">
              <th class="ps-4">ID</th>
              <th>STUDENT</th>
              <th>FACILITY</th>
              <th>DATE</th>
              <th>TIME</th>
              <th>PURPOSE</th>
              <th>STATUS</th>
              <th class="text-center">ACTIONS</th>
            </tr>
          </thead>
          <tbody id="adminTableBody">
            <tr>
              <td colspan="8" class="text-center text-muted py-3">Loading…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer class="text-center text-muted py-4 small">
      School Facility Management System | Admin Console © 2026
    </footer>
  </div>
</div>

<!-- Toast Container -->
<div id="toastContainer"
     style="position:fixed; top:20px; right:20px; z-index:9999; min-width:280px;"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
